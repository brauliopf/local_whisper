name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Swift tools
        run: brew install swiftformat swiftlint

      - name: Check formatting
        run: swiftformat --lint local_whisper

      - name: Lint Swift
        run: swiftlint lint --strict local_whisper

      - name: Build
        run: >-
          xcodebuild
          -project local_whisper.xcodeproj
          -scheme local_whisper
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
