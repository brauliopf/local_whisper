name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser-sidecar:
    name: Browser sidecar tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-sidecar
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-sidecar/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
